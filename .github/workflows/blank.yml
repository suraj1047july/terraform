    #     # crtx_url=$(echo $crtx_resp | jq -r ".signed_url")

    #     # if [ "$crtx_url" = "null" ] || [ -z "$crtx_url" ]; then
    #     #   echo "Failed to get download URL from Cortex API"
    #     #   exit 1
    #     # fi
        
    #     # curl -L -o cortexcli "$crtx_url"
    #     # chmod +x cortexcli
    #     # ./cortexcli --version
    #     curl -L -o cortexcli https://downloads.cortexcloud.io/unified-cli/latest/linux/amd64/cortexcli
    #     chmod +x cortexcli
    #     ./cortexcli --version

    # - name: Run Cortex CLI Code Scan
    #   run: |
    #     ./cortexcli \
    #       --api-base-url "${CORTEX_API_URL}" \
    #       --api-key "${CORTEX_API_KEY}" \
    #       --api-key-id "${CORTEX_API_KEY_ID}" \
    #       code scan \
    #       --directory "${{github.workspace}}" \
    #       --repo-id "${{github.repository}}" \
    #       --branch "${{github.ref_name}}" \
    #       --source "GITHUB_ACTIONS" \
    #       --create-repo-if-missing
    #     - name: Checkout Code
    #       uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
         terraform_version: 1.8.5
          
    - name: Terraform Cloud Login
      run: |
        mkdir -p ~/.terraform.d
        echo '{"credentials":{"app.terraform.io":{"token":"${{ secrets.TF_API_TOKEN }}"}}}' > ~/.terraform.d/credentials.tfrc.json
  
        - name: Terraform Init
          run: terraform init
          
        - name: Terraform Format Fix
          run: terraform fmt -recursive

        - name: Terraform Format Check
          run: terraform fmt -check -recursive

        - name: Terraform Validate
          run: terraform validate

        - name: Terraform Plan
          run: terraform plan


  terraform-apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest


    steps:
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Setup Terraform
         uses: hashicorp/setup-terraform@v3
         with:
          terraform_version: 1.8.5

       - name: Terraform Login
         run: |
           mkdir -p ~/.terraform.d 
           echo '{"credentials":{"app.terraform.io":{"token":"${{ secrets.TF_API_TOKEN }}"}}}' > ~/.terraform.d/credentials.tfrc.json       

       - name: Terraform Init
         run: terraform init

       - name: Terraform Apply
         run: terraform apply -auto-approve


