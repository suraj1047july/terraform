name: Terraform CI/CD

on:
 push:
  branches:
   - aws
 pull_request:
  branches:
   - aws

   
jobs:
 create-pr:
  if: github.event_name == 'push'
  runs-on: ubuntu-latest
  steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Create Pull Request
    uses: peter-evans/create-pull-request@v6
    with:
      base: aws_feature
      branch: aws
      title: "Auto PR: aws → main"
      body: "Automated Pull Request created by GitHub Actions."

 terraform-plan:
  if: github.event_name == 'pull_request'
  runs-on: ubuntu-latest
  steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      
  - name: Verify Node.js Version
    run: node -v

  - name: Install jq
    run: sudo apt-get update && sudo apt-get install -y jq

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: 1.8.5

  - name: Terraform Login
    run: |
     mkdir -p ~/.terraform.d
     echo '{"credentials":{"app.terraform.io":{"token":"${{ secrets.TF_API_TOKEN }}"}}}' > ~/.terraform.d/credentials.tfrc.json

  - name: Terraform Init
    run: terraform init

  - name: Terraform Format Fix
    run: terraform fmt -recursive

  - name: Terraform Format Check
    run: terraform fmt -check -recursive

  - name: Terraform Validate
    run: terraform validate

  - name: Terraform Plan
    run: terraform plan


 terraform-apply:
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest


  steps:

  - name: Checkout Code
    uses: actions/checkout@v4


  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3
    with:
      terraform_version: 1.8.5


  - name: Terraform Login
    run: |
      mkdir -p ~/.terraform.d
      echo '{"credentials":{"app.terraform.io":{"token":"${{ secrets.TF_API_TOKEN }}"}}}' > ~/.terraform.d/credentials.tfrc.json


  - name: Terraform Init
    run: terraform init


  - name: Terraform Apply
    run: terraform apply -auto-approve

